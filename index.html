<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chamfer Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: estilo Apple, branco e arejado. Barra de vidro fosca no topo, índice discreto à esquerda, uma aula por vez com títulos grandes. Azul Chamfer como cor de ação, laranja só em detalhes. */
:root{
  --bg:#FFFFFF; --panel:#F5F5F7; --panel-2:#FBFBFD; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B; --line:#E5E5EA;
  --brand:#003366; --brand-soft:#EEF2F7; --on-brand:#FFFFFF; --bar:rgba(255,255,255,.78);
  --accent:#F5A800; --accent-ink:#9A6A00; --accent-soft:#FFF7E3;
  --good:#248A3D; --good-soft:#EAF6EC; --bad:#D70015; --bad-soft:#FDECEE;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
  --side:280px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1C1C1E; --panel-2:#111113; --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#8E8E93; --line:#2C2C2E;
  --brand:#8DB4DE; --brand-soft:#16243A; --on-brand:#0A1A2E; --bar:rgba(0,0,0,.72);
  --accent:#F5A800; --accent-ink:#F5B829; --accent-soft:#2A2210;
  --good:#30D158; --good-soft:#0F2A16; --bad:#FF6961; --bad-soft:#3A1614;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1C1C1E; --panel-2:#111113; --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#8E8E93; --line:#2C2C2E;
  --brand:#8DB4DE; --brand-soft:#16243A; --on-brand:#0A1A2E; --bar:rgba(0,0,0,.72);
  --accent:#F5A800; --accent-ink:#F5B829; --accent-soft:#2A2210;
  --good:#30D158; --good-soft:#0F2A16; --bad:#FF6961; --bad-soft:#3A1614;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.53;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;min-height:52px;max-width:1240px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.02em;white-space:nowrap;background:none;border:0;padding:0;color:var(--ink)}
.brand b{color:var(--brand);font-weight:600}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);min-width:0}
.prog-bar{width:140px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog span{font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn{display:none;background:var(--panel);border:0;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500}

/* Grade */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 52px);overflow:auto;padding-block:28px;padding-right:20px}
.side h2{font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 10px 10px;letter-spacing:0}
.mod{margin-bottom:10px}
.mod-h{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px}
.mod-h:hover:not([disabled]){background:var(--panel)}
.mod-h[disabled]{cursor:not-allowed;opacity:.45}
.mod-h.fin .mod-n{color:var(--good)}
.mod-n{font-weight:600;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.mod-t{font-weight:600;font-size:15px;color:var(--ink);flex:1;line-height:1.3;letter-spacing:-.015em}
.mod-c{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.les{list-style:none;margin:2px 0 6px;padding:0 0 0 18px}
.les button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:8px;font-size:14px;line-height:1.35;color:var(--ink-2)}
.les button:hover:not([disabled]){background:var(--panel);color:var(--ink)}
.les button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:500}
.les .locked button{cursor:not-allowed;opacity:.45}
.dot{flex:none;width:15px;height:15px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.done .dot{background:var(--good);border-color:var(--good)}
.done .dot::after{content:"";width:6px;height:3px;border:1.6px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.locked .dot{border-style:dashed}
.les .quiz-i{font-style:normal;font-weight:600;color:var(--accent-ink)}

/* Conteúdo */
.main{padding-block:44px 80px;padding-left:56px;min-width:0}
.crumb{font-size:14px;font-weight:600;color:var(--accent-ink);margin-bottom:8px;letter-spacing:-.01em}
.crumb b{font-weight:600}
.lesson{max-width:700px}
.lesson h1{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:clamp(32px,4.4vw,48px);line-height:1.08;letter-spacing:-.035em;margin:0 0 10px;text-wrap:balance}
.meta{font-size:14px;color:var(--ink-3);margin-bottom:36px}
.lesson h3{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:24px;letter-spacing:-.025em;line-height:1.2;margin:48px 0 12px;text-wrap:balance}
.lesson h4{font-size:14px;font-weight:600;color:var(--ink-2);margin:24px 0 10px;letter-spacing:-.01em}
.lesson p{margin:0 0 16px;color:var(--ink)}
.lead{font-size:21px;line-height:1.45;letter-spacing:-.02em;color:var(--ink-2)!important}
.lesson ul.b{margin:0 0 18px;padding-left:22px}
.lesson ul.b li{margin:6px 0}
.lesson ul.b li::marker{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px;padding:0;list-style:none}
.chips li{border-radius:999px;padding:6px 14px;font-size:14px;background:var(--panel);color:var(--ink)}
.chips.caps li{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brand);background:var(--brand-soft)}
.chips.big li{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;padding:12px 22px;background:var(--panel)}
blockquote{margin:32px 0;padding:0;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.6vw,28px);line-height:1.3;letter-spacing:-.025em;color:var(--brand);text-wrap:balance}
.note{display:flex;gap:12px;margin:20px 0;padding:16px 18px;background:var(--accent-soft);border-radius:14px;font-size:15px}
.note strong{color:var(--accent-ink);font-size:13px;font-weight:600;flex:none;padding-top:1px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 22px;padding:0;list-style:none}
.flow li{display:flex;align-items:center;gap:8px;font-size:14px}
.flow li span{border-radius:999px;padding:6px 14px;background:var(--panel)}
.flow li:not(:last-child)::after{content:"›";color:var(--ink-3);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin:12px 0 24px}
.card{background:var(--panel);border-radius:18px;padding:22px;min-width:0}
.card h5{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:0 0 8px}
.card p{font-size:15px;margin:0 0 10px;color:var(--ink-2)}
.card ul{margin:0;padding-left:18px;font-size:15px}
.card ul li{margin:3px 0}
.card ul li::marker{color:var(--ink-3)}
.sw{display:flex;gap:14px;align-items:center}
.sw i{flex:none;width:40px;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.sw-branco{background:#FFFFFF}.sw-preto{background:#1B1B1B}
.sw-natural{background:linear-gradient(135deg,#EDEBE3,#D9D6CB);opacity:.85}
.sw-random{background:repeating-conic-gradient(#D5DBE3 0 25%,#FFFFFF 0 50%) 0 0/12px 12px}
.sw-pig{background:conic-gradient(#E3342F,#F5A800,#38A169,#3182CE,#805AD5,#E3342F)}
.sw-pcr{background:radial-gradient(circle at 30% 30%,#9AA5A0 2px,transparent 3px) 0 0/9px 9px,#C7CEC9}
.sw-pantone{background:linear-gradient(#003366 0 33%,#F5A800 33% 66%,#C2185B 66%)}
.tbl{overflow-x:auto;margin:12px 0 24px;border-radius:18px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--ink-3)}
td:first-child{font-weight:600;color:var(--ink)}
.timeline{list-style:none;margin:12px 0 24px;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:baseline;padding:16px 20px;background:var(--panel);border-radius:14px}
.timeline b{font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums}

/* Rodapé da aula */
#endMark{height:1px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);max-width:700px}
.btn{border-radius:999px;padding:10px 20px;font-weight:500;font-size:15px;border:0;background:var(--panel);color:var(--ink);transition:transform .15s,opacity .2s,background .2s}
.btn:hover:not([disabled]){background:var(--line)}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary,.btn.cta{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover:not([disabled]),.btn.cta:hover:not([disabled]){background:var(--brand);opacity:.88}
.btn.cta{padding:13px 26px;font-size:17px}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.hint{font-size:13px;color:var(--ink-3)}
.hint.ok{color:var(--good)}
.spacer{flex:1}

/* Início */
.hero{padding:24px 0 40px;max-width:820px}
.hero .eb,.finish .eb{font-size:17px;font-weight:600;color:var(--accent-ink);letter-spacing:-.015em}
.hero h1,.finish h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,72px);line-height:1.04;letter-spacing:-.045em;margin:8px 0 18px;text-wrap:balance;color:var(--ink)}
.hero p,.finish p{max-width:56ch;margin:0 0 28px;font-size:21px;line-height:1.45;letter-spacing:-.02em;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:36px;margin-bottom:32px}
.stats div{font-size:14px;color:var(--ink-2)}
.stats b{display:block;font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.mods{display:grid;gap:14px;max-width:820px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.mcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--panel);border:0;border-radius:18px;padding:20px 22px;transition:transform .2s,box-shadow .2s}
.mcard:hover:not([disabled]){transform:translateY(-2px);box-shadow:var(--shadow)}
.mcard[disabled]{cursor:not-allowed;opacity:.5}
.mcard .n{font-weight:600;font-size:15px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mcard .h{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:0 0 2px}
.mcard .p{display:block;font-size:14px;color:var(--ink-2)}
.ring{width:44px;height:44px}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--good);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{font-size:11px;font-weight:600;fill:var(--ink-2);font-family:var(--f-body)}

/* Revisão */
.q{background:var(--panel);border-radius:18px;padding:24px;margin:0 0 16px}
.q h5{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:0 0 16px;line-height:1.35}
.q h5 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:6px;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid transparent;background:var(--bg);border-radius:12px;padding:12px 16px;font-size:16px;transition:border-color .15s}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin:14px 0 0;font-size:15px;color:var(--ink-2)}
.score{font-weight:600;color:var(--ink);margin:8px 0 0}

/* Conclusão */
.finish{position:relative;padding:40px 0 24px;max-width:820px;overflow:hidden}
.finish canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cert{max-width:700px;margin:8px 0 20px;padding:clamp(28px,5vw,48px);border-radius:24px;background:var(--panel-2);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);text-align:center}
.cert-eb{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em}
.cert-name{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,40px);letter-spacing:-.035em;color:var(--brand);margin:18px 0 10px;overflow-wrap:anywhere}
.cert p{margin:0 auto 26px;max-width:46ch;color:var(--ink-2)}
.cert-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3)}
.cert-brand{font-weight:600;color:var(--ink)}.cert-brand b{color:var(--brand);font-weight:600}
.name-row{display:grid;gap:8px;max-width:420px}
.name-row label{font-size:14px;font-weight:500;color:var(--ink-2)}
.name-row input{border:0;background:var(--panel);border-radius:12px;padding:12px 16px;font-size:17px;width:100%}

.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .main{padding-left:0;padding-block:28px 56px}
  .menu-btn{display:inline-block}
  .prog-bar{width:72px}
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(86vw,330px);max-height:none;background:var(--bg);
    padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .timeline li{grid-template-columns:1fr;gap:2px}
  .mcard{grid-template-columns:32px minmax(0,1fr) auto;padding:16px}
  .hint{order:5;flex-basis:100%}
}
@media (max-width:480px){.prog span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Conteúdo</button>
    <button class="brand" id="homeBtn" aria-label="Início da trilha">Chamfer <b>Academy</b></button>
    <div class="prog" aria-label="Progresso da trilha">
      <div class="prog-bar"><i id="progFill"></i></div>
      <span id="progTxt">0% concluído</span>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Módulos e aulas"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<script>
const COURSE = [
{ id:'1', t:'Chamfer institucional', d:'Quem somos, onde estamos e o que nos move.', lessons:[
  { id:'1-1', t:'40 anos transformando plástico em soluções', b:[
    ['lead','Há 40 anos, a Chamfer transforma plástico em soluções que fazem parte do dia a dia de diferentes mercados e ajudam empresas a apresentar, proteger, transportar e comercializar seus produtos.'],
    ['p','Ao longo de quatro décadas, construímos uma trajetória marcada pela evolução, pelo desenvolvimento de novas soluções e pela proximidade com nossos clientes.'],
    ['p','Hoje, a Chamfer é uma das empresas de destaque na América Latina com embalagens plásticas rígidas, com um portfólio amplo e diversificado, desenvolvido para atender diferentes necessidades e segmentos da indústria.'],
    ['h','Um parque industrial em São Paulo'],
    ['p','Nossa operação está sediada em São Paulo, em um parque industrial estruturado para reunir diferentes etapas da nossa operação e proporcionar maior integração entre as áreas.'],
    ['p','A estrutura da Chamfer reúne:'],
    ['chips',['Tecnologia','Capacidade produtiva','Desenvolvimento','Controle de qualidade','Logística','Equipes especializadas']],
    ['p','Uma operação preparada para atender às demandas de um mercado cada vez mais exigente.']
  ]},
  { id:'1-2', t:'Um portfólio completo de embalagens', b:[
    ['lead','Quando falamos em Chamfer, falamos em variedade.'],
    ['p','Nosso portfólio contempla diferentes famílias de embalagens plásticas rígidas, incluindo:'],
    ['chips-big',['Potes','Baldes','Frascos']],
    ['p','São diferentes formatos, capacidades, materiais, cores, sistemas de fechamento e possibilidades de personalização.'],
    ['p','Do pote de menor capacidade aos baldes de grandes volumes, desenvolvemos soluções para diferentes aplicações e necessidades industriais.'],
    ['h','Segmentos atendidos'],
    ['p','Essa amplitude permite que a Chamfer atue em diversos segmentos, como:'],
    ['chips',['Alimentos','Sorvetes e Açaí','Conservas','Doces e Pastas','Cosméticos','Pet','Tintas','Químicos','Construção','Agro','Lubrificantes','Food Service']],
    ['p','Entre outros.']
  ]},
  { id:'1-3', t:'Mais do que uma embalagem', b:[
    ['lead','Uma embalagem não é apenas um recipiente. Ela precisa cumprir uma função.'],
    ['p','Precisa proteger o produto, facilitar seu armazenamento e transporte, atender aos requisitos da aplicação e, muitas vezes, também contribuir para a apresentação e o posicionamento da marca.'],
    ['cards',[{t:'Proteger',d:'Preservar o produto acondicionado.'},{t:'Armazenar e transportar',d:'Facilitar a logística do cliente.'},{t:'Atender à aplicação',d:'Cumprir os requisitos técnicos do uso.'},{t:'Posicionar a marca',d:'Contribuir para a apresentação do produto.'}]],
    ['p','Por isso, nosso trabalho vai além da fabricação de uma peça plástica.'],
    ['p','Buscamos desenvolver soluções em embalagens que façam sentido para o produto, para o processo do cliente e para o mercado em que ele atua.']
  ]},
  { id:'1-4', t:'Tecnologia e personalização', b:[
    ['lead','A Chamfer possui diferentes possibilidades de personalização para transformar uma embalagem em uma extensão da marca do cliente.'],
    ['p','Entre elas estão:'],
    ['chips-big',['IML','Serigrafia','Acabamento Liso']],
    ['p','Cada solução possui características próprias e pode ser indicada de acordo com o projeto, aplicação, quantidade, identidade visual e necessidade do cliente.'],
    ['p','O resultado é uma embalagem que não apenas acondiciona um produto, mas também ajuda a comunicar sua marca.'],

/* ---------- estado ---------- */
const KEY='chamfer-academy-v1';
let state={done:{},answers:{},scores:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)state=Object.assign(state,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const ITEMS=[];
COURSE.forEach(m=>{m.lessons.forEach(l=>ITEMS.push({key:'l'+l.id,mod:m,lesson:l}));ITEMS.push({key:'q'+m.id,mod:m,quiz:true})});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=b=>JSON.stringify(b).split(/\s+/).length;
const mins=l=>Math.max(2,Math.round(words(l.b)/180));

function block(b){
  const [k,v]=b;
  switch(k){
    case 'p':return `<p>${esc(v)}</p>`;
    case 'lead':return `<p class="lead">${esc(v)}</p>`;
    case 'h':return `<h3>${esc(v)}</h3>`;

    case 'chips-big':return `<ul class="chips big">${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    case 'caps':return `<ul class="chips caps" aria-label="Capacidades">${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    case 'quote':return `<blockquote>${esc(v)}</blockquote>`;
    case 'note':return `<div class="note"><strong>Atenção</strong><span>${esc(v)}</span></div>`;
    case 'flow':return `<ol class="flow">${v.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`;
    case 'timeline':return `<ol class="timeline">${v.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol>`;
    case 'cards':return `<div class="cards">${v.map(c=>`<div class="card"><h5>${esc(c.t)}</h5>${c.d?`<p>${esc(c.d)}</p>`:''}${c.items?`<ul>${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`;
    case 'split':return `<div class="cards">${v.map(c=>`<div class="card"><h5>${esc(c.t)}</h5><ul>${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    case 'swatch':return `<h3 class="sw"><i class="sw-${v.sw}" aria-hidden="true"></i><span>${esc(v.t)}</span></h3><p>${esc(v.d)}</p>`;

/* ---------- ordem obrigatória ---------- */
// Cada item só abre quando todos os anteriores estão concluídos.
const firstOpen=()=>{const i=ITEMS.findIndex(x=>!state.done[x.key]);return i<0?ITEMS.length:i};
const isOpen=idx=>idx<=firstOpen();
const allDone=()=>firstOpen()===ITEMS.length;
const resumeKey=()=>allDone()?'fim':ITEMS[firstOpen()].key;
function modTarget(m){
  const idxs=ITEMS.map((x,i)=>x.mod===m?i:-1).filter(i=>i>=0);
  if(!isOpen(idxs[0]))return null;
  const t=idxs.find(i=>!state.done[ITEMS[i].key]&&isOpen(i));
  return ITEMS[t!=null?t:idxs[0]].key;
}
function modAttr(m){const t=modTarget(m);return t?`data-go="${t}"`:'disabled title="Conclua o módulo anterior para liberar"'}

/* ---------- navegação lateral ---------- */
const side=document.getElementById('side'),main=document.getElementById('main');
function modCount(m){const keys=[...m.lessons.map(l=>'l'+l.id),'q'+m.id];return [keys.filter(k=>state.done[k]).length,keys.length]}
function renderSide(cur){
  side.innerHTML='<h2>Conteúdo da trilha</h2>'+COURSE.map(m=>{
    const [d,t]=modCount(m);
    return `<div class="mod"><button class="mod-h" ${modAttr(m)}><span class="mod-n">${m.id.padStart(2,'0')}</span><span class="mod-t">${esc(m.t)}</span><span class="mod-c">${d}/${t}</span></button>
    <ul class="les">${m.lessons.map(l=>li('l'+l.id,esc(l.t))).join('')}${li('q'+m.id,'<em class="quiz-i">Revisão</em> do módulo')}</ul></div>`;
  }).join('')+(allDone()?`<button class="mod-h fin" data-go="fim"><span class="mod-n">✓</span><span class="mod-t">Conclusão da trilha</span></button>`:'');
  function li(k,label){
    const lock=!isOpen(ITEMS.findIndex(i=>i.key===k));
    return `<li class="${state.done[k]?'done':''}${lock?' locked':''}"><button ${lock?'disabled title="Conclua as aulas anteriores para liberar"':`data-go="${k}"`} ${k===cur?'aria-current="true"':''}><span class="dot" aria-hidden="true"></span><span>${label}</span></button></li>`;
  }
}
function renderProgress(){
  const total=ITEMS.length,d=ITEMS.filter(i=>state.done[i.key]).length,p=Math.round(d/total*100);
  document.getElementById('progFill').style.width=p+'%';
  document.getElementById('progTxt').textContent=p+'% concluído';

function ring(d,t){const r=18,c=2*Math.PI*r,p=t?d/t:0;return `<svg class="ring" viewBox="0 0 44 44" aria-label="${d} de ${t} concluídas"><circle class="bg" cx="22" cy="22" r="${r}"/><circle class="fg" cx="22" cy="22" r="${r}" stroke-dasharray="${c*p} ${c}"/><text x="22" y="26" text-anchor="middle">${d}/${t}</text></svg>`}
function renderHome(){
  const started=ITEMS.some(i=>state.done[i.key]);
  const nL=COURSE.reduce((a,m)=>a+m.lessons.length,0),nMin=COURSE.reduce((a,m)=>a+m.lessons.reduce((x,l)=>x+mins(l),0),0);

    <div class="mods">${COURSE.map(m=>{const [d,t]=modCount(m),lock=!modTarget(m);return `<button class="mcard" ${modAttr(m)}><span class="n">${m.id.padStart(2,'0')}</span><span><span class="h">${esc(m.t)}</span><span class="p">${lock?'Bloqueado até concluir o módulo anterior.':esc(m.d)+' '+m.lessons.length+' aulas.'}</span></span>${ring(d,t)}</button>`}).join('')}</div>`;
  renderSide(null);

let endObs=null;
function renderItem(idx){
  if(endObs){endObs.disconnect();endObs=null}
  const it=ITEMS[idx],m=it.mod,prev=ITEMS[idx-1],next=ITEMS[idx+1];
  const crumb=`<div class="crumb"><b>Módulo ${m.id.padStart(2,'0')}</b> · ${esc(m.t)}</div>`;
  let body;
  if(it.quiz){
    body=`${crumb}<article class="lesson"><h1>Revisão do módulo</h1><div class="meta">${m.quiz.length} perguntas · responda todas para liberar o próximo módulo</div>
    ${m.quiz.map((q,i)=>quizQ(m,q,i)).join('')}<p class="score" id="score"></p></article>`;
  }else{
    const l=it.lesson;
    body=`${crumb}<article class="lesson"><h1>${esc(l.t)}</h1><div class="meta">Leitura de ~${mins(l)} min</div>${l.b.map(block).join('')}</article>`;
  }
  const done=!!state.done[it.key];
  main.innerHTML=body+`<div id="endMark" aria-hidden="true"></div><div class="foot">
    <button class="btn" data-go="${prev?prev.key:'home'}">← ${prev?'Anterior':'Início'}</button>
    <span class="spacer"></span>
    <span class="hint${done?' ok':''}" id="hint">${hintText(it,done)}</span>
    <button class="btn primary" id="nextBtn" data-go="${next?next.key:'fim'}" ${done?'':'disabled'}>${next?(next.mod!==m?'Próximo módulo →':'Próxima →'):'Concluir trilha'}</button></div>`;
  if(it.quiz)updateScore(m);
  renderSide(it.key);
  if(!done&&!it.quiz)watchEnd(it);
}
function hintText(it,done){
  if(it.quiz)return done?'Revisão concluída':'Responda todas as perguntas para avançar';
  return done?'Aula concluída':'Role até o fim da aula para liberar a próxima';
}
function unlock(it){
  state.done[it.key]=true;save();renderProgress();renderSide(it.key);
  const b=document.getElementById('nextBtn'),h=document.getElementById('hint');
  if(b)b.disabled=false;
  if(h){h.textContent=hintText(it,true);h.classList.add('ok')}
}
// A aula conta como lida quando o fim dela aparece na tela.
function watchEnd(it){
  const mark=document.getElementById('endMark');
  const check=()=>{if(!mark.isConnected){stop();return}
    if(mark.getBoundingClientRect().top<=window.innerHeight+4){stop();unlock(it)}};
  const stop=()=>{window.removeEventListener('scroll',check);window.removeEventListener('resize',check);clearInterval(timer);endObs=null};
  window.addEventListener('scroll',check,{passive:true});window.addEventListener('resize',check);
  const timer=setInterval(check,500);
  endObs={disconnect:stop};
  setTimeout(check,250);
}
function quizQ(m,q,i){
  const k=m.id+'-'+i,ans=state.answers[k];
  const opts=q.o.map((o,j)=>{let c='opt';if(ans!=null){if(j===q.a)c+=' right';else if(j===ans)c+=' wrong'}
    return `<button class="${c}" data-q="${k}" data-j="${j}" ${ans!=null?'disabled':''}>${esc(o)}</button>`}).join('');
  const fb=ans==null?'':`<p class="exp">${ans===q.a?'<b>Correto.</b> ':'<b>Resposta certa destacada em verde.</b> '}${esc(q.e)}</p>`;
  return `<div class="q"><h5><small>Pergunta ${i+1}</small>${esc(q.q)}</h5><div class="opts">${opts}</div>${fb}</div>`;
}
function updateScore(m){
  const n=m.quiz.length,ans=m.quiz.map((q,i)=>state.answers[m.id+'-'+i]);
  const answered=ans.filter(a=>a!=null).length,right=m.quiz.filter((q,i)=>ans[i]===q.a).length;
  const el=document.getElementById('score');if(!el)return;
  if(answered===n){
    el.innerHTML=`Você acertou ${right} de ${n}. <button class="btn" id="retry" style="margin-left:8px">Refazer revisão</button>`;
    document.getElementById('retry').onclick=()=>{m.quiz.forEach((q,i)=>delete state.answers[m.id+'-'+i]);save();route();renderProgress()};
  } else el.textContent=`${answered} de ${n} respondidas`;
}

  renderSide(null);
  confetti(document.getElementById('confetti'));

function confetti(cv){
  if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.offsetWidth,H=cv.offsetHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const cols=['#003366','#F5A800','#8DB4DE','#C7CED8'];
  const ps=Array.from({length:110},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,w:5+Math.random()*6,h:8+Math.random()*8,
    vy:1.6+Math.random()*2.2,vx:-.6+Math.random()*1.2,r:Math.random()*6,vr:-.15+Math.random()*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    if(!cv.isConnected)return;
    ctx.clearRect(0,0,W,H);const age=t-t0;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-Math.max(0,age-3500)/1200);
      ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(age<4700)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- rotas ---------- */
function route(){
  const h=location.hash.slice(1);
  if(h==='fim'){if(allDone())renderFinish();else location.replace('#'+resumeKey());return}
  const idx=ITEMS.findIndex(i=>i.key===h);
  if(idx<0){renderHome();return}
  if(!isOpen(idx)){location.replace('#'+resumeKey());return}
  renderItem(idx);
}
function go(k){
  closeMenu();
  window.scrollTo({top:0});
  if(k==='home'){history.replaceState(null,'',location.pathname+location.search);renderHome()}
  else if(location.hash.slice(1)===k)route();else location.hash=k;
}
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');
  if(q){const k=q.dataset.q,mid=k.split('-')[0];state.answers[k]=+q.dataset.j;
    const m=COURSE.find(x=>x.id===mid);
    if(m.quiz.every((_,i)=>state.answers[mid+'-'+i]!=null)){
      state.done['q'+mid]=true;
      state.scores[mid]=m.quiz.filter((qq,i)=>state.answers[mid+'-'+i]===qq.a).length;
    }
    save();const y=window.scrollY;route();window.scrollTo({top:y});renderProgress();return}
  const g=e.target.closest('[data-go]');if(!g||g.disabled)return;
  go(g.dataset.go);
});
window.addEventListener('hashchange',route);
document.getElementById('homeBtn').onclick=()=>go('home');

/* menu móvel */
const menuBtn=document.getElementById('menuBtn'),scrim=document.getElementById('scrim');
function closeMenu(){side.classList.remove('open');scrim.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.onclick=()=>{const o=!side.classList.contains('open');side.classList.toggle('open',o);scrim.classList.toggle('open',o);menuBtn.setAttribute('aria-expanded',String(o))};
scrim.onclick=closeMenu;

route();renderProgress();
</script>
</body>
</html>
